<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Atrium</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#070F22">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="atrium.css">
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script>window.JEDI_REQUEST={app:"The Atrium"};</script>
<script src="jedi-request.js"></script>
</head>
<body>
<div id="app" hidden>
  <aside id="sidebar" aria-label="Workspace navigation"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="wardrobe" id="wardrobe" hidden></div>
  <main>
    <div class="topbar">
      <button type="button" class="iconbtn menu-btn" id="menuBtn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button type="button" class="iconbtn menu-btn" id="mobileGear" aria-label="Wardrobe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <div class="crumb" id="crumb">Workspace <span>/</span><b>Projects</b></div>
      <div class="top-actions"><a href="changelog.html">Changelog</a></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script src="atrium.js"></script>
</body>
</html>
