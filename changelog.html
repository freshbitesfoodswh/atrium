<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Changelog — The Atrium</title>
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-display:swap}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#F3F6FD;background:radial-gradient(ellipse at 85% 0,#142E60,transparent 50%),#070F22;padding:24px}
a{color:#A9C9FF}h1{font-weight:600;letter-spacing:-.04em;margin:8px 0 6px}
.item{background:linear-gradient(120deg,#1A2E50,#101D35);border:1px solid #354F77;border-radius:14px;padding:14px 16px;margin:10px 0}
.v{color:#91B9FF;font-weight:700}.d{opacity:.55;font-size:13px;margin-left:8px}.app{opacity:.8;font-size:13px;margin:4px 0}
</style></head><body>
<p><a href="./">← The Atrium</a></p>
<h1>Changelog</h1>
<p style="opacity:.65">Every iteration we ship. Semver + date (America/Chicago).</p>
<div id="list">Loading…</div>
<script>
fetch('versions.json',{cache:'no-store'}).then(r=>r.json()).then(rows=>{
  list.innerHTML=rows.map(x=>`<div class="item"><span class="v">v${x.version}</span><span class="d">${x.date}</span>
  <div class="app">${x.app}</div><div>${x.notes}</div></div>`).join('');
});
</script>
</body></html>
